services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arxiv}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ${POSTGRES_DB:-arxiv}
    volumes:
      - ${ARXIV_SECRETS_DIR:?ARXIV_SECRETS_DIR is required}/postgres-password:/run/secrets/postgres-password:ro
      - arxiv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-arxiv} -d $${POSTGRES_DB:-arxiv}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  arxiv:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    user: "1000:1000"
    init: true
    ports:
      - "127.0.0.1:80:8080"
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      ADMIN_TOKEN_FILE: /run/secrets/admin-token
      QWEN_WORKER_TOKEN_FILE: /run/secrets/qwen-worker-token
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google-client-secret
      ARXIV_CACHE: /data/arxiv
      PORT: 8080
      HOME: /home/arxiv
      HF_HOME: /data/arxiv/huggingface
      SENTENCE_TRANSFORMERS_HOME: /data/arxiv/sentence-transformers
      TRANSFORMERS_CACHE: /data/arxiv/huggingface/transformers
      PYTHONDONTWRITEBYTECODE: "1"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:?INDEXNOW_KEY is required}
      INDEXNOW_QUEUE_FILE: /data/arxiv/indexnow-urls
      ARXIV_OFFICIAL_TOTAL_PAPERS: ${ARXIV_OFFICIAL_TOTAL_PAPERS:-3045638}
      ARXIV_OFFICIAL_TOTAL_PAPERS_AS_OF: ${ARXIV_OFFICIAL_TOTAL_PAPERS_AS_OF:-2026-05-16}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://arxiv.gg/auth/google/callback}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      GOOGLE_ADSENSE_CLIENT_ID: ${GOOGLE_ADSENSE_CLIENT_ID:-}
      BING_SITE_VERIFICATION_ID: ${BING_SITE_VERIFICATION_ID:-}
      SITE_URL: ${SITE_URL:-https://arxiv.gg}
      QWEN_EMBEDDING_SERVICE_URL: ${QWEN_EMBEDDING_SERVICE_URL:-}
      QWEN_ASYNC_WORKER_ENABLED: ${QWEN_ASYNC_WORKER_ENABLED:-false}
      ARXIV_DB_MAX_OPEN_CONNS: ${ARXIV_DB_MAX_OPEN_CONNS:-30}
      ARXIV_DB_MAX_IDLE_CONNS: ${ARXIV_DB_MAX_IDLE_CONNS:-10}
      ARXIV_DETAIL_CACHE_SIZE: ${ARXIV_DETAIL_CACHE_SIZE:-20000}
      ARXIV_AUTHOR_QUERY_CONCURRENCY: ${ARXIV_AUTHOR_QUERY_CONCURRENCY:-4}
      ARXIV_CITATION_QUERY_CONCURRENCY: ${ARXIV_CITATION_QUERY_CONCURRENCY:-4}
    volumes:
      - ${ARXIV_DATA_DIR:-/data/arxiv}:/data/arxiv
      - ${ARXIV_SECRETS_DIR}/database-url:/run/secrets/database-url:ro
      - ${ARXIV_SECRETS_DIR}/admin-token:/run/secrets/admin-token:ro
      - ${ARXIV_SECRETS_DIR}/qwen-worker-token:/run/secrets/qwen-worker-token:ro
      - ${ARXIV_SECRETS_DIR}/google-client-secret:/run/secrets/google-client-secret:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  arxiv_postgres_data:
    external: true

networks:
  default:
    name: ${ARXIV_NETWORK_NAME:?ARXIV_NETWORK_NAME is required}
    external: true
